name: Build and publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - name: Audit mobile performance and accessibility
        run: |
          mkdir -p reports
          node scripts/serve.mjs &
          PORTFOLIO_SERVER_PID=$!
          trap 'kill "$PORTFOLIO_SERVER_PID"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4339/ > /dev/null; then break; fi
            sleep 1
          done
          npm exec --yes --package=lighthouse@13.5.0 -- lighthouse http://127.0.0.1:4339/ --chrome-flags="--headless --no-sandbox --disable-gpu" --output=json --output-path=reports/lighthouse-mobile.json --quiet
          node scripts/audit-results.mjs reports/lighthouse-mobile.json
      - name: Save Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile
          path: reports/lighthouse-mobile.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
